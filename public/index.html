<style>
  /* ---------- Design tokens: night-shift ops console ----------
     To change the accent, edit --accent and the three rgba() values beside it
     (same RGB, different alpha). Teal = 94,224,207. */
  :root{
    --ground:#070E1C;  --panel:#0D182B;  --panel-hover:#12203A;  --chip:#0A1426;
    --line:#1B2A44;    --line-2:#1F3050; --line-3:#25385A;       --grid:#16243D;
    --text:#EAF1FA;    --text-hi:#F4F8FD; --text-2:#C9D6E8;      --muted:#93A4BD;  --dim:#7E91AD;
    --accent:#5EE0CF;  --accent-soft:rgba(94,224,207,0.12); --glow:rgba(94,224,207,0.24); --accent-line:rgba(94,224,207,0.5);
    --sky:#7FB2FF;     --on-accent:#04121F;
    --display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ background:var(--ground); overscroll-behavior-y:none; }
  html,body{ margin:0; }
  body{ font-family:var(--sans); color:var(--text); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:3px; border-radius:10px; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .page{ min-height:100vh; min-height:100svh; display:flex; flex-direction:column; background:var(--ground); }

  /* ---------- Hero scene ---------- */
  .hero{ position:relative; height:500px; overflow:hidden; flex-shrink:0;
    background-image:linear-gradient(#16243D 1px, transparent 1px), linear-gradient(90deg, #16243D 1px, transparent 1px);
    background-size:26px 26px; background-position:center top; }
  .scene{ position:absolute; left:50%; top:0; width:390px; height:500px; transform:translateX(-50%); display:block; overflow:visible; }
  .scene-d{ display:none; }
  .scene .loop-soft{ fill:none; stroke-opacity:.12; }
  .scene .loop-line{ fill:none; stroke-width:1.5; stroke-opacity:.7; }
  .scene .flow{ fill:none; stroke:var(--accent); stroke-width:3; stroke-linecap:round; }
  .scene .node-ops{ stroke:var(--accent); }
  .scene .lbl-ops{ fill:var(--accent); }
  .scene .stop-acc{ stop-color:var(--accent); }
  .glow{
    position:absolute; left:50%; bottom:210px; width:200px; height:200px; margin-left:-100px; border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, rgba(7,14,28,0) 70%);
  }
  .pipeline{
    position:absolute; left:16px; right:16px; top:max(20px, env(safe-area-inset-top));
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; color:#CFE0F5;
  }
  .pipeline .step{ display:flex; align-items:center; gap:5px; padding:6px 9px; border:1px solid var(--line-2); border-radius:999px; background:var(--chip); white-space:nowrap; }
  .pipeline .step svg{ width:12px; height:12px; stroke:var(--accent); flex:none; }
  .pipeline .step.live{ border-color:var(--accent-line); color:var(--text); gap:6px; }
  .pipeline .dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); display:block; }
  .pipeline .wire{ flex-grow:1; height:1px; background:#2A3D5E; min-width:6px; }
  .portrait{
    position:absolute; left:50%; bottom:0; width:380px; max-width:97%; height:auto; transform:translateX(-50%);
    display:block; filter:drop-shadow(0 0 22px var(--glow));
  }
  .fade{ position:absolute; left:0; right:0; bottom:0; height:130px; background:linear-gradient(180deg, rgba(7,14,28,0) 0%, rgba(7,14,28,.85) 70%, var(--ground) 100%); pointer-events:none; }

  /* ---------- Content ---------- */
  .content{ width:100%; max-width:440px; margin:0 auto; display:flex; flex-direction:column; flex:1; }
  .intro{ position:relative; margin-top:-58px; padding:0 24px; display:flex; flex-direction:column; gap:10px; }
  .whoami{ font-family:var(--mono); font-size:12px; color:var(--accent); }
  h1{ margin:0; font-family:var(--display); font-size:44px; line-height:1; font-weight:600; letter-spacing:-0.02em; color:var(--text-hi); }
  .role{ margin:0; font-size:18px; line-height:1.4; font-weight:500; color:var(--text-2); }

  .actions{ padding:28px 24px 0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
  .btn{ display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:background .18s ease, transform .12s ease; }
  .btn:active{ transform:translateY(1px) scale(.995); }
  .btn svg{ width:17px; height:17px; flex:none; }
  .btn-primary{ grid-column:1 / -1; height:56px; border:0; border-radius:14px; background:var(--accent); color:var(--on-accent); font-size:16px; font-weight:600; gap:10px; }
  .btn-primary svg{ width:19px; height:19px; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ height:48px; border-radius:12px; border:1px solid var(--line-3); background:#0B1528; color:var(--text); font-size:14px; font-weight:500; }
  .btn-ghost:hover{ background:var(--panel-hover); }

  .links{ padding:32px 24px 0; display:flex; flex-direction:column; gap:8px; }
  .links-label{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--dim); padding-bottom:4px; }
  .row{ min-height:64px; padding:0 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:14px; transition:background .18s ease, transform .12s ease; }
  .row:hover{ background:var(--panel-hover); }
  .row:active{ transform:translateY(1px); }
  .row .ic{ width:38px; height:38px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; flex:none; }
  .row .ic svg{ width:19px; height:19px; }
  .row .tx{ display:flex; flex-direction:column; gap:2px; flex-grow:1; min-width:0; }
  .row .name{ font-size:15px; font-weight:600; color:var(--text-hi); }
  .row .sub{ font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
  .row .go{ width:16px; height:16px; color:var(--dim); flex:none; }

  footer{ margin-top:auto; padding:40px 24px max(40px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  footer .rule{ width:40px; height:1px; background:var(--line-3); }
  footer p{ margin:0; font-size:14px; color:var(--muted); }

  /* ---------- Desktop: split layout ---------- */
  @media (min-width:900px){
    .page{ flex-direction:row; min-height:100vh; }
    .hero{ position:sticky; top:0; width:clamp(480px, 46vw, 680px); height:100vh; min-height:640px; border-right:1px solid var(--grid); }
    .hero{ background-size:30px 30px; background-position:center bottom; }
    .scene-m{ display:none; }
    .scene-d{ display:block; top:auto; bottom:0; width:600px; height:800px; }
    .glow{ bottom:210px; width:320px; height:320px; margin-left:-160px; }
    .pipeline{ left:36px; right:36px; top:36px; gap:8px; font-size:12px; }
    .pipeline .step{ padding:7px 12px; gap:6px; }
    .pipeline .step svg{ width:13px; height:13px; }
    .pipeline .dot{ width:8px; height:8px; }
    .portrait{ width:560px; max-width:93%; filter:drop-shadow(0 0 28px var(--glow)); }
    .fade{ height:90px; background:linear-gradient(180deg, rgba(7,14,28,0) 0%, rgba(7,14,28,.7) 100%); }

    .content{ max-width:none; margin:0; padding:72px clamp(48px, 7vw, 96px); justify-content:center; gap:36px; min-height:100vh; }
    .intro{ margin-top:0; padding:0; gap:14px; }
    .whoami{ font-size:14px; }
    h1{ font-size:clamp(56px, 6vw, 76px); line-height:.98; letter-spacing:-0.025em; }
    .role{ font-size:22px; }
    .actions{ padding:0; display:flex; gap:12px; max-width:488px; }
    .btn-primary{ flex-grow:1; padding:0 24px; }
    .btn-ghost{ width:56px; height:56px; flex-shrink:0; border-radius:14px; }
    .btn-ghost svg{ width:19px; height:19px; }
    .btn-ghost .lbl{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
    .links{ padding:0; max-width:488px; }
    .row{ padding:0 18px; }
    footer{ margin-top:0; padding:0; align-items:flex-start; text-align:left; }
    footer .rule{ display:none; }
  }

  /* ---------- QR overlay ---------- */
  #qrModal{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:24px;
    background:rgba(4,9,18,0.78); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  }
  #qrModal.show{ display:flex; }
  #qrModal .sheet{
    background:var(--panel); border:1px solid var(--line-2); border-radius:22px;
    padding:22px 22px 18px; max-width:320px; width:100%; text-align:center;
    box-shadow:0 30px 70px -20px rgba(0,0,0,0.8);
  }
  #qrModal .sheet h3{ margin:0 0 4px; font-family:var(--display); font-size:20px; font-weight:600; color:var(--text-hi); }
  #qrModal .sheet p{ margin:0 0 14px; font-family:var(--mono); font-size:11px; color:var(--muted); word-break:break-all; }
  #qrModal .qrbox{ background:#F4F8FD; border-radius:14px; padding:6px; }
  #qrModal .qrbox svg{ width:100%; height:auto; display:block; }
  #qrModal .close{
    margin-top:14px; width:100%; height:48px; border:0; border-radius:12px; cursor:pointer;
    font-family:var(--sans); font-size:14px; font-weight:600; color:var(--on-accent); background:var(--accent);
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:var(--panel); color:var(--text); border:1px solid var(--line-3);
    padding:12px 16px; border-radius:12px; font-size:13px; max-width:88vw;
    box-shadow:0 20px 50px -20px rgba(0,0,0,0.8);
    opacity:0; pointer-events:none; transition:opacity .22s ease, transform .22s ease; z-index:50;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  /* ---------- Motion ---------- */
  @media (prefers-reduced-motion:no-preference){
    .scene .flow{ animation:zgflow 7s linear infinite; }
    .pipeline .dot{ animation:zgpulse 1.8s ease-in-out infinite; }
    .reveal{ opacity:0; transform:translateY(10px); animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--i, 0) * 70ms); }
  }
  @keyframes zgflow{ from{ stroke-dashoffset:100; } to{ stroke-dashoffset:0; } }
  @keyframes zgpulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  @keyframes rise{ to{ opacity:1; transform:none; } }
</style>
</head>

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

          }

<script>
/* =========================================================================
   EDIT ONLY THIS BLOCK.  Anything left blank ("") simply won't show up.
   ========================================================================= */
const CONFIG = {
  firstName: "Zach",
  lastName:  "Gause",
  fullName:  "Zach Gause",
  roleText:  "Cloud DevOps Engineer",

  showShare: true,
  showQR:    true,

  // Goes into the saved contact card (vCard)
  org:    "",
  title:  "Cloud DevOps Engineer",

  phone:    "+15132389028",
  email:    "zach.gause@gmail.com",
  website:  "",

  location: { city: "", region: "", country: "" },

  // Order here = order on the page. Blank url = hidden.
  socials: [
    { key:"phone",    name:"Call/Text", sub:"513.238.9028",          url:"tel:+15132389028" },
    { key:"mail",     name:"Email",     sub:"zach.gause@gmail.com",  url:"mailto:zach.gause@gmail.com" },
    { key:"linkedin", name:"LinkedIn",  sub:"in/zach-gause",         url:"https://www.linkedin.com/in/zach-gause" },
  ],

  footerHTML: "Great to meet you. Let's stay in touch.",
};
/* ===================== stop editing here ===================== */

const ICONS = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  github:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0 0-5ZM3 9h4v12H3V9Zm6 0h3.8v1.7h.1c.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 5.9V21h-4v-5.5c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9V21H9V9Z"/></svg>',
};
const ARROW = '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>';

function esc(s){ return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

document.getElementById('name').textContent = CONFIG.fullName;
document.getElementById('role').textContent = CONFIG.roleText;
document.getElementById('portrait').alt = 'Portrait of ' + CONFIG.fullName;
document.getElementById('footer').innerHTML = CONFIG.footerHTML || '';

document.getElementById('socials').innerHTML = CONFIG.socials
  .filter(s => s.url && s.url.trim())
  .map(s => `<a class="row" href="${esc(s.url)}"${/^https?:/i.test(s.url) ? ' target="_blank" rel="noopener"' : ''}>
      <span class="ic" aria-hidden="true">${ICONS[s.key] || ICONS.globe}</span>
      <span class="tx"><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.sub||'')}</span></span>
      ${ARROW}
    </a>`).join('');

/* ---- vCard: the "save my number" magic ---- */
function buildVCard(){
  const L = CONFIG.location;
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `N:${CONFIG.lastName};${CONFIG.firstName};;;`,
    `FN:${CONFIG.fullName}`,
    CONFIG.org   ? `ORG:${CONFIG.org}` : '',
    CONFIG.title ? `TITLE:${CONFIG.title}` : '',
    CONFIG.phone ? `TEL;TYPE=CELL,VOICE:${CONFIG.phone}` : '',
    CONFIG.email ? `EMAIL;TYPE=INTERNET:${CONFIG.email}` : '',
    CONFIG.website ? `URL:${CONFIG.website}` : '',
    (L.city||L.region||L.country) ? `ADR;TYPE=WORK:;;;${L.city||''};${L.region||''};;${L.country||''}` : '',
    ...CONFIG.socials.filter(s=>s.url && /^https?:/i.test(s.url.trim())).map(s=>`URL:${s.url}`),
    'END:VCARD'
  ].filter(Boolean);
  return lines.join('\r\n');
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove('show'), 3200);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  try{
    const blob = new Blob([buildVCard()], { type:'text/vcard;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${CONFIG.fullName}.vcf`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Contact card downloaded — open it to add me.');
  }catch(e){
    toast('Could not download. Try the call or email button instead.');
  }
});

/* ---- Share + QR ---- */
(function(){
  const shareBtn = document.getElementById('shareBtn');
  const qrBtn = document.getElementById('qrBtn');
  if (!CONFIG.showShare) shareBtn.remove();
  if (!CONFIG.showQR) qrBtn.remove();
  if (!!CONFIG.showShare !== !!CONFIG.showQR){
    const left = CONFIG.showShare ? shareBtn : qrBtn;
    left.style.gridColumn = '1 / -1';
  }

  if (CONFIG.showShare){
    shareBtn.addEventListener('click', async () => {
      try{
        if (navigator.share){
          await navigator.share({ title: CONFIG.fullName, text: CONFIG.fullName, url: location.href });
        } else {
          await navigator.clipboard.writeText(location.href);
          toast('Link copied to clipboard.');
        }
      }catch(e){ /* user dismissed the share sheet */ }
    });
  }

  if (CONFIG.showQR){
    const modal = document.getElementById('qrModal');
    const box = document.getElementById('qrbox');
    const closeBtn = document.getElementById('qrClose');
    const openQR = () => {
      document.getElementById('qrUrl').textContent = location.href;
      if (!box.dataset.rendered && typeof qrcode === 'function'){
        try{
          const qr = qrcode(0, 'M'); qr.addData(location.href); qr.make();
          let svg = qr.createSvgTag({ cellSize: 8, margin: 10, scalable: true });
          svg = svg.replace(/fill="white"/g, 'fill="#F4F8FD"')
                   .replace(/fill="black"/g, 'fill="#070E1C"');
          box.innerHTML = svg; box.dataset.rendered = '1';
        }catch(e){ box.innerHTML = '<p>Could not render code.</p>'; }
      }
      modal.classList.add('show'); modal.setAttribute('aria-hidden','false');
      closeBtn.focus();
    };
    const closeQR = () => { modal.classList.remove('show'); modal.setAttribute('aria-hidden','true'); qrBtn.focus(); };
    qrBtn.addEventListener('click', openQR);
    closeBtn.addEventListener('click', closeQR);
    modal.addEventListener('click', (e)=>{ if (e.target === modal) closeQR(); });
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && modal.classList.contains('show')) closeQR(); });
  }
})();
</script>
